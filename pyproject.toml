[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osm_voice_assistant"
version = "0.1.0"
dependencies = [
  "openai-whisper",
  "llama-cpp-python",      # or whichever llama binding
  "overpy",
  "openvoice",
  "fastapi",               # if using the server
  "uvicorn[standard]",
]
[project.scripts]
osm-assistant = "cli:main"
